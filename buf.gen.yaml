# Codegen for the Go side of the contract. C++ and TypeScript outputs get added when there is a
# consumer for them: C++ at the first service that must verify a capability token, TypeScript at the
# console. Generating outputs nothing reads is how a contract rots unnoticed.
version: v2
inputs:
  - directory: proto
managed:
  enabled: true
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative

  # TypeScript for the console. Added at M6.3, when there was finally a consumer — generating an
  # output nothing reads is how a contract rots unnoticed, which is why this was not here from
  # the start. The plugin is the one installed into console/node_modules, so `make proto` needs
  # `npm install` to have run there.
  - local: ./console/node_modules/.bin/protoc-gen-es
    out: console/src/gen
    opt: target=ts
